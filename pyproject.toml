[project]
name = "erasure-qec"
version = "0.2.0"
description = "Herald-conditioned decoding of the erasure-converted rotated surface code"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Naman Srivastava" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "stim>=1.14",
    "pymatching>=2.2",
    "sinter>=1.14",
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/albnewt97/erasure-qec"
Issues = "https://github.com/albnewt97/erasure-qec/issues"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erasure_qec"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF100"]

[tool.ruff.lint.isort]
known-first-party = ["erasure_qec"]

[tool.mypy]
strict = true
files = ["src", "tests"]
# Every `# type: ignore` in this repo is error-code scoped, which is what keeps
# the P16 hazard narrow (a suppression relocated by `ruff format` still fails
# on a line whose error has a different code). Nothing enforced that property
# until now; this does.
enable_error_code = ["ignore-without-code"]

[[tool.mypy.overrides]]
module = ["stim.*", "pymatching.*", "sinter.*", "scipy.*", "matplotlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# sinter ships untyped: its Decoder/CompiledDecoder base classes resolve to
# Any, which strict mode would otherwise refuse to subclass.
module = "erasure_qec.decoding.sinter_adapter"
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselected by default in CI with -m \"not slow\")",
]

[tool.coverage.run]
source = ["src/erasure_qec"]
