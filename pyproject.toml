[project]
name = "erasure-qec"
version = "0.1.0"
description = "Herald-conditioned decoding of the erasure-converted rotated surface code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "stim>=1.14",
    "pymatching>=2.2",
    "sinter>=1.14",
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erasure_qec"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["erasure_qec"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["stim.*", "pymatching.*", "sinter.*", "scipy.*", "matplotlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# sinter ships untyped: its Decoder/CompiledDecoder base classes resolve to
# Any, which strict mode would otherwise refuse to subclass.
module = "erasure_qec.decoding.sinter_adapter"
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselected by default in CI with -m \"not slow\")",
]

[tool.coverage.run]
source = ["src/erasure_qec"]
