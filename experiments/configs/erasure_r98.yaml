# Threshold sweep, erasure-dominated regime: r_e = 0.98 (biased-erasure
# hardware limit; threshold expected to slide toward ~4-5%).
# Rounds are always T = d (PLAN.md §9). herald_mwpm vs blind_mwpm on
# identical shots is the §10 ablation.
name: erasure_r98
r_e: 0.98
distances: [3, 5, 7, 9, 11]
p_log10_min: -3.0
p_log10_max: -1.0
p_points: 13
# Additive fit-resolution bands bracketing the r_e=0.98 herald crossing.
# First band (0.030-0.050) was a prediction extrapolated from the measured
# r_e=0 (~1.4%) and r_e=0.5 (~2.2%) crossings -- it UNDERSHOT: the herald_mwpm
# curves are still below threshold at p=0.050 and the d-ordering does not
# invert until before p=0.068, so the MEASURED crossing sits in [0.050, 0.068].
# Second band (0.052-0.064) re-centers on that observed bracket. Both bands are
# kept (the sweep is resumable; the first band's points stay collected and
# still trace the sub-threshold curve). blind_mwpm crosses much lower (~0.025),
# which the existing log grid + first band already resolve adequately, so no
# extra points are added there. Merged with the log grid (sorted, de-duped).
extra_p: [0.030, 0.035, 0.040, 0.045, 0.050, 0.052, 0.055, 0.058, 0.061, 0.064]
max_shots: 100000
max_errors: 1000
decoders: [herald_mwpm, blind_mwpm]

# Fixed sub-threshold p for the Lambda scan (below the ~4-5% r_e=0.98 threshold).
lambda_p: 0.025
