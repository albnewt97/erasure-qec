# Threshold sweep, erasure-dominated regime: r_e = 0.98 (biased-erasure
# hardware limit; threshold expected to slide toward ~4-5%).
# Rounds are always T = d (PLAN.md §9). herald_mwpm vs blind_mwpm on
# identical shots is the §10 ablation.
name: erasure_r98
r_e: 0.98
distances: [3, 5, 7, 9, 11]
p_log10_min: -3.0
p_log10_max: -1.0
p_points: 13
# Additive fit-resolution bands bracketing the r_e=0.98 herald crossing.
# First band (0.030-0.050) was a prediction extrapolated from the measured
# r_e=0 (~1.4%) and r_e=0.5 (~2.2%) crossings -- it UNDERSHOT under the old
# (budget-shrinking) noise model, where the crossing sat in [0.050, 0.068]. The
# corrected constant-budget model (2/3*p*r_e herald rate) RAISES the erasure
# rate ~33% at r_e=0.98, shifting the herald crossing higher again, so a third
# band (0.067-0.085) brackets the fixed-model crossing. All bands are kept (the
# sweep is resumable; sub-threshold points still trace the curve). blind_mwpm
# crosses much lower, which the log grid + lower bands already resolve. Merged
# with the log grid (sorted, de-duped).
extra_p: [0.030, 0.035, 0.040, 0.045, 0.050, 0.052, 0.055, 0.058, 0.061, 0.064,
          0.067, 0.070, 0.073, 0.076, 0.080, 0.085]
max_shots: 100000
max_errors: 1000
decoders: [herald_mwpm, blind_mwpm]

# Fixed sub-threshold p for the Lambda scan (below the ~4-5% r_e=0.98 threshold).
lambda_p: 0.025

# Per-shot densification band, added 2026-10-14 (pre-registered rule, integer
# units of 1e-4). Source: results/threshold_table_committed.json
# (sha256 5079307a87b73baf5142a7f0f4971e4f6799b51af0c082939af28fd4925ae443).
# For each decoder, c = its per-shot (7,11) pairwise crossing in that file;
#   u = round(c * f * 10_000) for f in (0.80, 0.87, 0.93, 1.00, 1.07, 1.15, 1.25).
# Union over decoders; drop u if |u - e| <= 2 for any e = round(p * 10_000)
# over the resolved p_values (log grid + extra_p); sort ascending; drop u within
# 2 of the last kept one; extra_p_shot = kept u / 10_000. Merged into the p grid
# like extra_p (union, sorted, de-duplicated).
extra_p_shot: [0.0107, 0.0114, 0.0123, 0.0131, 0.0141, 0.0154, 0.0310, 0.0337,
               0.0360, 0.0387, 0.0414, 0.0445, 0.0484]
